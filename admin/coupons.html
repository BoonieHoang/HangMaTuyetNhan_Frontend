<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Mã Giảm Giá - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-points {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <!-- Sidebar -->
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="holidays.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="calendar-days" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Ngày Lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="coupons.html" class="flex items-center px-2 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="ticket-percent" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Mã giảm giá</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Mã Giảm Giá</h1>
            </div>
            <a href="coupon-form.html" id="btn-add"
                class="flex items-center gap-2 bg-primary text-white px-5 py-2.5 rounded-lg hover:bg-primary/90 shadow font-medium transition">
                Thêm mã giảm giá
            </a>
        </div>


        <!-- Filter -->
        <div class="bg-white p-4 rounded-t-lg shadow border-b flex gap-3">
            <input type="text" id="search" placeholder="Tìm mã, mô tả..."
                class="border rounded px-3 py-2 flex-1 outline-none focus:border-primary"
                onkeyup="if(event.key==='Enter') loadItems(1)">
            <select id="filter-active" class="border rounded px-3 py-2 outline-none focus:border-primary">
                <option value="">Tất cả trạng thái</option>
                <option value="1">Hoạt động</option>
                <option value="0">Vô hiệu</option>
            </select>
            <button onclick="loadItems(1)" class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-700 shadow">Tìm
                kiếm</button>
        </div>

        <div class="bg-white rounded-b-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 border-b text-gray-700">
                    <tr>
                        <th class="p-4">Mã / Mô tả</th>
                        <th class="p-4 text-center">Loại giảm giá</th>
                        <th class="p-4 text-center">Giá trị</th>
                        <th class="p-4 text-center">Điểm đổi</th>
                        <th class="p-4 text-center">Đã dùng</th>
                        <th class="p-4 text-center">Hết hạn</th>
                        <th class="p-4 text-center">Trạng thái</th>
                        <th class="p-4 text-right">Hành động</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-gray-800"></tbody>
            </table>
            <div id="pagination" class="p-4 flex justify-center space-x-2 border-t"></div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentPage = 1;
        let allItems = [];

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';
            loadItems();
        });



        async function loadItems(page = 1) {
            currentPage = page;
            const params = new URLSearchParams({ page });
            if (document.getElementById('search').value) params.append('search', document.getElementById('search').value);
            const activeFilter = document.getElementById('filter-active').value;
            if (activeFilter !== '') params.append('is_active', activeFilter);

            try {
                const res = await ApiClient.get(`/admin/coupons?${params.toString()}`);
                allItems = res.data;



                renderTable(res.data);
                renderPagination(res.meta || res);
            } catch (err) { console.error(err); }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-gray-400">Chưa có mã giảm giá nào.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(c => {
                const discountLabel = c.discount_type === 'percent'
                    ? `${parseFloat(c.discount_value)}%${c.max_discount ? ` (tối đa ${Number(c.max_discount).toLocaleString('vi-VN')}đ)` : ''}`
                    : `${Number(c.discount_value).toLocaleString('vi-VN')}đ`;
                const statusBadge = c.is_active
                    ? `<span class="px-2 py-1 rounded-full text-xs font-bold badge-active">Hoạt động</span>`
                    : `<span class="px-2 py-1 rounded-full text-xs font-bold badge-inactive">Vô hiệu</span>`;
                const expiresLabel = c.expires_at
                    ? new Date(c.expires_at) < new Date()
                        ? `<span class="text-red-500">${new Date(c.expires_at).toLocaleDateString('vi-VN')}</span>`
                        : new Date(c.expires_at).toLocaleDateString('vi-VN')
                    : '<span class="text-gray-400">Không hết hạn</span>';
                const usedLabel = c.usage_limit
                    ? `${c.used_count}/${c.usage_limit}`
                    : `${c.used_count}`;

                return `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4">
                        <div class="font-mono font-bold text-primary text-base">${c.code}</div>
                        <div class="text-xs text-gray-500 mt-0.5">${c.description || ''}</div>
                        ${c.min_order_amount > 0 ? `<div class="text-xs text-gray-400">Đơn từ ${Number(c.min_order_amount).toLocaleString('vi-VN')}đ</div>` : ''}
                    </td>
                    <td class="p-4 text-center">
                        <span class="px-2 py-1 rounded text-xs font-medium ${c.discount_type === 'percent' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'}">
                            ${c.discount_type === 'percent' ? 'Phần trăm' : 'Cố định'}
                        </span>
                    </td>
                    <td class="p-4 text-center font-semibold text-gray-800">${discountLabel}</td>
                    <td class="p-4 text-center">
                        <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full badge-points text-xs font-bold">
                            ⭐ ${c.points_cost} điểm
                        </span>
                    </td>
                    <td class="p-4 text-center text-gray-700">${usedLabel}</td>
                    <td class="p-4 text-center text-xs">${expiresLabel}</td>
                    <td class="p-4 text-center">${statusBadge}</td>
                    <td class="p-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <a href="coupon-form.html?id=${c.id}"
                                class="p-1.5 text-blue-600 hover:bg-blue-50 rounded transition inline-block align-middle" title="Sửa">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </a>
                            <button onclick="deleteCoupon(${c.id}, '${c.code}', ${c.used_count})"
                                class="p-1.5 text-red-600 hover:bg-red-50 rounded transition" title="Xóa">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        function renderPagination(meta) {
            const el = document.getElementById('pagination');
            el.innerHTML = '';
            if (!meta || meta.last_page <= 1) return;
            for (let i = 1; i <= meta.last_page; i++) {
                el.innerHTML += `<button onclick="loadItems(${i})" class="px-3 py-1 border rounded ${i === currentPage ? 'bg-primary text-white' : 'bg-white hover:bg-gray-100'}">${i}</button>`;
            }
        }



        async function deleteCoupon(id, code, usedCount) {
            if (usedCount > 0) {
                showNotification(`Không thể xóa mã "${code}" vì đã có ${usedCount} lượt sử dụng.`, 'error');
                return;
            }
            const confirmed = await showConfirm('Xóa mã giảm giá', `Bạn có chắc muốn xóa mã "${code}"?`);
            if (!confirmed) return;
            try {
                await ApiClient.delete(`/admin/coupons/${id}`);
                showNotification('Xóa thành công!', 'success');
                loadItems(currentPage);
            } catch (err) {
                showNotification(err.message || 'Có lỗi xảy ra', 'error');
            }
        }
    </script>
</body>

</html>
