<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã Giảm Giá - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6F2A2A', accent: '#c49a45', bgtheme: '#F3EFE9', } } } }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f3ee;
        }
    </style>
</head>

<body class="bg-bgtheme flex h-screen overflow-hidden text-sm">
    <aside class="w-72 bg-primary text-gray-200 flex flex-col flex-shrink-0">
        <div class="p-8 pb-10">
            <h1 class="text-2xl font-bold leading-1 tracking-wider uppercase">
                Cửa hàng<br>Tuyết Nhàn
            </h1>
        </div>
        <nav class="flex-1">
            <a href="dashboard.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Trang quản trị</span>
            </a>
            <a href="orders.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="shopping-bag" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý đơn hàng</span>
            </a>
            <a href="products.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="package" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý sản phẩm</span>
            </a>
            <a href="categories.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="layers" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý danh mục</span>
            </a>
            <a href="rituals.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="book-open" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý nghi lễ</span>
            </a>
            <a href="users.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="users" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Quản lý tài khoản</span>
            </a>
            <a href="coupons.html" class="flex items-center px-6 py-4 transition-colors bg-bgtheme text-primary">
                <i data-lucide="ticket-percent" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Mã giảm giá</span>
            </a>
            <a href="analytics.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="bar-chart-3" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Thống kê</span>
            </a>
            <a href="system-config.html"
                class="flex items-center px-6 py-4 transition-colors hover:bg-bgtheme hover:text-primary">
                <i data-lucide="settings" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Cài đặt</span>
            </a>
        </nav>
        <div class="p-6">
            <button onclick="Auth.logout()"
                class="flex items-center w-full px-6 py-4 transition-colors hover:text-gray-500 text-white">
                <i data-lucide="log-out" class="w-6 h-6 mr-4"></i>
                <span class="font-medium uppercase">Đăng xuất</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full">
            <div class="mb-4">
                <a href="coupons.html" class="text-gray-600 hover:text-primary">&larr; Quay lại danh sách</a>
            </div>

            <h1 id="page-title" class="text-2xl font-bold text-gray-800 mb-6">Thêm Mã Giảm Giá</h1>

            <div class="bg-white p-8 md:p-10 rounded-lg shadow w-full">
                <form id="coupon-form" class="space-y-6">
                    <input type="hidden" id="coupon-id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Mã giảm giá *</label>
                            <input type="text" id="code" placeholder="VD: GIAM50K" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary uppercase">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Điểm cần đổi *</label>
                            <input type="number" id="points_cost" placeholder="VD: 50" min="0" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="space-y-6 pt-4 border-t">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Mô tả</label>
                            <input type="text" id="description" placeholder="Mô tả ngắn gọn về mã giảm giá"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Loại giảm giá *</label>
                            <select id="discount_type" onchange="toggleDiscountFields()" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                                <option value="fixed">Giảm tiền cố định (VND)</option>
                                <option value="percent">Giảm theo % đơn hàng</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700" id="label-discount-value">Số tiền giảm (VND) *</label>
                            <input type="number" id="discount_value" placeholder="VD: 50000" min="1" required
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Đơn tối thiểu (VND)</label>
                            <input type="number" id="min_order_amount" placeholder="VD: 200000" min="0"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div id="max-discount-field" style="display: none;">
                            <label class="block font-semibold mb-1 text-gray-700">Giảm tối đa (VND)</label>
                            <input type="number" id="max-discount" placeholder="VD: 100000" min="0"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t">
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Giới hạn tổng lượt dùng</label>
                            <input type="number" id="usage_limit" placeholder="Để trống = không giới hạn" min="1"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-gray-700">Hết hạn lúc</label>
                            <input type="datetime-local" id="expires_at"
                                class="w-full border rounded px-3 py-2.5 outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="space-y-6 pt-4 border-t">
                        <div>
                            <label class="flex items-center space-x-2 cursor-pointer w-fit">
                                <input type="checkbox" id="is_active" checked class="rounded text-primary w-5 h-5">
                                <span class="text-sm font-medium text-gray-700">Kích hoạt mã giảm giá ngay</span>
                            </label>
                        </div>
                    </div>

                    <div class="text-right border-t pt-6">
                        <button type="submit" id="btn-submit"
                            class="bg-primary text-white px-8 py-2.5 rounded shadow hover:opacity-90 font-bold uppercase tracking-wider text-xs">Lưu Mã Giảm Giá</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const couponId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            Auth.requireLogin();
            const user = await Auth.getUser();
            if (!user || user.role !== 'admin') return window.location.href = '../index.html';

            if (couponId) {
                document.getElementById('page-title').innerText = 'Sửa Mã Giảm Giá';
                loadCoupon(couponId);
            }
        });

        function toggleDiscountFields() {
            const type = document.getElementById('discount_type').value;
            const label = document.getElementById('label-discount-value');
            const maxField = document.getElementById('max-discount-field');
            if (type === 'percent') {
                label.textContent = 'Tỷ lệ giảm (%) *';
                document.getElementById('discount_value').placeholder = 'VD: 10 (cho 10%)';
                maxField.style.display = '';
            } else {
                label.textContent = 'Số tiền giảm (VND) *';
                document.getElementById('discount_value').placeholder = 'VD: 50000';
                maxField.style.display = 'none';
                document.getElementById('max-discount').value = '';
            }
        }

        async function loadCoupon(id) {
            try {
                const res = await ApiClient.get(`/admin/coupons/${id}`);
                const c = res.data || res;
                document.getElementById('coupon-id').value = c.id;
                document.getElementById('code').value = c.code;
                document.getElementById('description').value = c.description || '';
                document.getElementById('discount_type').value = c.discount_type;
                document.getElementById('discount_value').value = parseFloat(c.discount_value);
                document.getElementById('points_cost').value = c.points_cost;
                document.getElementById('min_order_amount').value = c.min_order_amount ? parseFloat(c.min_order_amount) : '';
                document.getElementById('max-discount').value = c.max_discount ? parseFloat(c.max_discount) : '';
                document.getElementById('usage_limit').value = c.usage_limit || '';
                document.getElementById('expires_at').value = c.expires_at
                    ? new Date(c.expires_at).toISOString().slice(0, 16) : '';
                document.getElementById('is_active').checked = !!c.is_active;
                toggleDiscountFields();
            } catch (err) {
                showNotification('Lỗi tải mã giảm giá', 'error');
            }
        }

        document.getElementById('coupon-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Đang lưu...';

            const id = document.getElementById('coupon-id').value;
            const payload = {
                code: document.getElementById('code').value.toUpperCase().trim(),
                description: document.getElementById('description').value,
                discount_type: document.getElementById('discount_type').value,
                discount_value: parseFloat(document.getElementById('discount_value').value),
                points_cost: parseInt(document.getElementById('points_cost').value),
                min_order_amount: parseFloat(document.getElementById('min_order_amount').value) || 0,
                max_discount: document.getElementById('max-discount').value ? parseFloat(document.getElementById('max-discount').value) : null,
                usage_limit: document.getElementById('usage_limit').value ? parseInt(document.getElementById('usage_limit').value) : null,
                expires_at: document.getElementById('expires_at').value || null,
                is_active: document.getElementById('is_active').checked,
            };

            try {
                if (id) {
                    await ApiClient.put(`/admin/coupons/${id}`, payload);
                } else {
                    await ApiClient.post('/admin/coupons', payload);
                }
                showNotification('Lưu mã giảm giá thành công!', 'success');
                setTimeout(() => window.location.href = 'coupons.html', 1000);
            } catch (err) {
                showNotification(err.message || 'Có lỗi xảy ra', 'error');
                btn.disabled = false;
                btn.innerText = 'Lưu Mã Giảm Giá';
            }
        });
    </script>
</body>

</html>
